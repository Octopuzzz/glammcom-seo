<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="globeGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#FF6B35" />
      <stop offset="60%" stop-color="#E8470A" />
      <stop offset="100%" stop-color="#C73D08" />
    </radialGradient>
    <clipPath id="circleClip">
      <circle cx="100" cy="100" r="90" />
    </clipPath>
  </defs>

  <!-- Outer circle (globe outline) -->
  <circle cx="100" cy="100" r="90" stroke="url(#globeGrad)" stroke-width="2.5" fill="none" opacity="0.9"/>

  <!-- Latitude lines -->
  <ellipse cx="100" cy="100" rx="90" ry="28" stroke="url(#globeGrad)" stroke-width="1.8" fill="none" opacity="0.7"/>
  <ellipse cx="100" cy="100" rx="90" ry="58" stroke="url(#globeGrad)" stroke-width="1.8" fill="none" opacity="0.55"/>
  <line x1="10" y1="100" x2="190" y2="100" stroke="url(#globeGrad)" stroke-width="1.8" opacity="0.6"/>

  <!-- Longitude lines (vertical arcs approximated) -->
  <ellipse cx="100" cy="100" rx="28" ry="90" stroke="url(#globeGrad)" stroke-width="1.8" fill="none" opacity="0.7"/>
  <ellipse cx="100" cy="100" rx="60" ry="90" stroke="url(#globeGrad)" stroke-width="1.8" fill="none" opacity="0.55"/>
  <line x1="100" y1="10" x2="100" y2="190" stroke="url(#globeGrad)" stroke-width="1.8" opacity="0.6"/>

  <!-- Diagonal cross lines -->
  <line x1="22" y1="45" x2="178" y2="155" stroke="url(#globeGrad)" stroke-width="1.5" opacity="0.4"/>
  <line x1="22" y1="155" x2="178" y2="45" stroke="url(#globeGrad)" stroke-width="1.5" opacity="0.4"/>
</svg>
